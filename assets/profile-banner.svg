    <text x="48" y="103" fill="#f3f7fc" font-size="42" font-weight="700" letter-spacing="-1">Minje Kang</text>
    <text x="49" y="142" fill="#c6d8e7" font-size="20" letter-spacing=".4">Data, Models, Real Products.</text>
