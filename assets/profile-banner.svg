<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="title desc">
  <title id="title">Minje Kang — Data, Models, Real Products</title>
  <desc id="desc">A navy and teal banner introducing Minje Kang, a developer connecting data analysis and machine learning to real services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d35"/>
      <stop offset="1" stop-color="#153f4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#71e2ca"/>
      <stop offset="1" stop-color="#9cbfff"/>
    </linearGradient>
  </defs>
  <rect width="960" height="220" rx="20" fill="url(#bg)"/>
  <circle cx="880" cy="28" r="154" fill="#71e2ca" opacity=".035"/>
  <circle cx="880" cy="28" r="112" fill="none" stroke="#71e2ca" stroke-opacity=".12"/>
  <circle cx="880" cy="28" r="70" fill="none" stroke="#71e2ca" stroke-opacity=".12"/>
  <rect x="48" y="43" width="42" height="4" rx="2" fill="url(#accent)"/>
